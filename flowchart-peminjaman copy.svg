<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3550" viewBox="0 0 1400 3550" role="img" aria-labelledby="title description">
  <title id="title">IT Equipment Lending Portal Flowchart</title>
  <desc id="description">Workflow for loan requests, approvals, pickups, returns, and admin login.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; fill: #102a43; }
      .section { font-size: 24px; font-weight: 700; fill: #1d4ed8; }
      .node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 3; }
      .decision { fill: #fff7ed; stroke: #f59e0b; stroke-width: 3; }
      .end { fill: #ecfdf5; stroke: #10b981; stroke-width: 3; }
      .side { fill: #fff1f2; stroke: #fb7185; stroke-width: 2.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-size: 18px; font-weight: 600; fill: #475569; }
      .body { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 18px; font-weight: 500; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="3550" fill="#f8fafc"/>
  <text x="700" y="58" class="title" text-anchor="middle">IT Equipment Lending Portal Flowchart</text>
  <rect x="45" y="88" width="1310" height="2580" rx="26" class="panel"/>
  <text x="90" y="135" class="section">Loan and return workflow</text>

  <!-- Main flow -->
  <ellipse cx="700" cy="190" rx="130" ry="38" class="end"/>
  <text x="700" y="197" class="body">Start</text>
  <path d="M700 228 V258" class="line"/>

  <rect x="480" y="260" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="291" class="body"><tspan x="700">Borrower opens the portal</tspan><tspan x="700" dy="25">and selects an item</tspan></text>
  <path d="M700 334 V365" class="line"/>

  <rect x="480" y="367" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="398" class="body"><tspan x="700">Complete and submit</tspan><tspan x="700" dy="25">the loan request form</tspan></text>
  <path d="M700 441 V468" class="line"/>

  <polygon points="700,470 835,530 700,590 565,530" class="decision"/>
  <text x="700" y="525" class="small"><tspan x="700">Is the form</tspan><tspan x="700" dy="23">valid?</tspan></text>
  <path d="M565 530 H390" class="line"/>
  <text x="470" y="515" class="label">No</text>
  <rect x="110" y="492" width="280" height="76" rx="14" class="side"/>
  <text x="250" y="523" class="small"><tspan x="250">Correct the form</tspan><tspan x="250" dy="23">using the error message</tspan></text>
  <path d="M250 492 V405 H478" class="loop"/>
  <path d="M700 590 V631" class="line"/>
  <text x="720" y="617" class="label">Yes</text>

  <polygon points="700,633 840,695 700,757 560,695" class="decision"/>
  <text x="700" y="690" class="small"><tspan x="700">Is the item available</tspan><tspan x="700" dy="23">and not under maintenance?</tspan></text>
  <path d="M840 695 H1005" class="line"/>
  <text x="910" y="680" class="label">No</text>
  <rect x="1005" y="657" width="285" height="76" rx="14" class="side"/>
  <text x="1147" y="688" class="small"><tspan x="1147">Show item as</tspan><tspan x="1147" dy="23">unavailable</tspan></text>
  <path d="M1147 733 V780" class="line"/>
  <path d="M700 757 V790" class="line"/>
  <text x="720" y="780" class="label">Yes</text>

  <rect x="480" y="792" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="823" class="body"><tspan x="700">Save the request</tspan><tspan x="700" dy="25">with pending status</tspan></text>
  <path d="M700 866 V897" class="line"/>

  <rect x="480" y="899" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="943" class="body">Admin reviews the request</text>
  <path d="M700 973 V1000" class="line"/>

  <polygon points="700,1002 835,1062 700,1122 565,1062" class="decision"/>
  <text x="700" y="1057" class="small"><tspan x="700">Is the request</tspan><tspan x="700" dy="23">approved?</tspan></text>
  <path d="M565 1062 H390" class="line"/>
  <text x="475" y="1047" class="label">No</text>
  <rect x="110" y="1024" width="280" height="76" rx="14" class="side"/>
  <text x="250" y="1055" class="small"><tspan x="250">Save status as</tspan><tspan x="250" dy="23">rejected</tspan></text>
  <path d="M250 1100 V1150" class="line"/>
  <ellipse cx="250" cy="1188" rx="92" ry="34" class="end"/>
  <text x="250" y="1195" class="body">End</text>
  <path d="M700 1122 V1163" class="line"/>
  <text x="720" y="1149" class="label">Yes</text>

  <polygon points="700,1165 840,1227 700,1289 560,1227" class="decision"/>
  <text x="700" y="1222" class="small"><tspan x="700">Is the item still</tspan><tspan x="700" dy="23">available?</tspan></text>
  <path d="M840 1227 H1005" class="line"/>
  <text x="910" y="1212" class="label">No</text>
  <rect x="1005" y="1189" width="285" height="76" rx="14" class="side"/>
  <text x="1147" y="1220" class="small"><tspan x="1147">Request cannot be</tspan><tspan x="1147" dy="23">processed</tspan></text>
  <path d="M1147 1265 V1310" class="line"/>
  <path d="M700 1289 V1320" class="line"/>
  <text x="720" y="1310" class="label">Yes</text>

  <rect x="450" y="1322" width="500" height="90" rx="15" class="node"/>
  <text x="700" y="1357" class="body"><tspan x="700">Create a loan with process status</tspan><tspan x="700" dy="26">reserve stock and create a tracking token</tspan></text>
  <rect x="1010" y="1328" width="280" height="78" rx="14" class="node"/>
  <text x="1150" y="1358" class="small"><tspan x="1150">Borrower can track the</tspan><tspan x="1150" dy="23">loan using the token</tspan></text>
  <path d="M950 1367 H1010" class="loop"/>
  <path d="M700 1412 V1440" class="line"/>

  <rect x="450" y="1442" width="500" height="82" rx="15" class="node"/>
  <text x="700" y="1475" class="body"><tspan x="700">Admin prepares the item</tspan><tspan x="700" dy="25">and enters device details</tspan></text>
  <path d="M700 1524 V1550" class="line"/>

  <polygon points="700,1552 840,1614 700,1676 560,1614" class="decision"/>
  <text x="700" y="1609" class="small"><tspan x="700">Are all details</tspan><tspan x="700" dy="23">complete and valid?</tspan></text>
  <path d="M560 1614 H390" class="line"/>
  <text x="470" y="1599" class="label">No</text>
  <rect x="110" y="1576" width="280" height="76" rx="14" class="side"/>
  <text x="250" y="1607" class="small"><tspan x="250">Complete or correct</tspan><tspan x="250" dy="23">the device details</tspan></text>
  <path d="M250 1576 V1483 H448" class="loop"/>
  <path d="M700 1676 V1707" class="line"/>
  <text x="720" y="1698" class="label">Yes</text>

  <rect x="480" y="1709" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="1740" class="body"><tspan x="700">Status: Ready for Pickup</tspan><tspan x="700" dy="25">item is waiting for pickup</tspan></text>
  <path d="M700 1783 V1810" class="line"/>

  <polygon points="700,1812 840,1874 700,1936 560,1874" class="decision"/>
  <text x="700" y="1869" class="small"><tspan x="700">Is the pickup</tspan><tspan x="700" dy="23">confirmed?</tspan></text>
  <path d="M840 1874 H1005 V1800" class="loop"/>
  <text x="900" y="1858" class="label">No</text>
  <path d="M700 1936 V1967" class="line"/>
  <text x="720" y="1958" class="label">Yes</text>

  <rect x="480" y="1969" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="2000" class="body"><tspan x="700">Status changes to borrowed</tspan><tspan x="700" dy="25">record the pickup time</tspan></text>
  <path d="M700 2043 V2073" class="line"/>

  <rect x="480" y="2075" width="440" height="74" rx="15" class="node"/>
  <text x="700" y="2119" class="body">Borrower uses the item</text>
  <path d="M700 2149 V2177" class="line"/>

  <polygon points="700,2179 840,2241 700,2303 560,2241" class="decision"/>
  <text x="700" y="2236" class="small"><tspan x="700">Has the item been</tspan><tspan x="700" dy="23">returned?</tspan></text>
  <path d="M560 2241 H440 V2112 H478" class="loop"/>
  <text x="480" y="2225" class="label">No</text>
  <path d="M700 2303 V2333" class="line"/>
  <text x="720" y="2325" class="label">Yes</text>

  <rect x="450" y="2335" width="500" height="82" rx="15" class="node"/>
  <text x="700" y="2368" class="body"><tspan x="700">Admin confirms the return</tspan><tspan x="700" dy="25">and the due date</tspan></text>
  <path d="M700 2417 V2447" class="line"/>

  <rect x="450" y="2449" width="500" height="82" rx="15" class="node"/>
  <text x="700" y="2482" class="body"><tspan x="700">Record the return time</tspan><tspan x="700" dy="25">update stock or Serial Number</tspan></text>
  <path d="M700 2531 V2564" class="line"/>
  <ellipse cx="700" cy="2604" rx="110" ry="36" class="end"/>
  <text x="700" y="2611" class="body">End</text>

  <!-- Admin login flow -->
  <rect x="45" y="2700" width="1310" height="815" rx="26" class="panel"/>
  <text x="90" y="2750" class="section">Admin login workflow</text>
  <ellipse cx="700" cy="2812" rx="105" ry="34" class="end"/>
  <text x="700" y="2819" class="body">Start</text>
  <path d="M700 2846 V2865" class="line"/>
  <rect x="480" y="2867" width="440" height="66" rx="14" class="node"/>
  <text x="700" y="2907" class="body">Admin opens the login page</text>
  <path d="M700 2933 V2950" class="line"/>
  <rect x="480" y="2952" width="440" height="66" rx="14" class="node"/>
  <text x="700" y="2992" class="body">Enter name and password</text>
  <path d="M700 3018 V3030" class="line"/>
  <polygon points="700,3032 845,3090 700,3148 555,3090" class="decision"/>
  <text x="700" y="3085" class="small"><tspan x="700">Are the credentials valid</tspan><tspan x="700" dy="23">and is the role admin?</tspan></text>
  <path d="M555 3090 H385" class="line"/>
  <text x="470" y="3075" class="label">No</text>
  <rect x="110" y="3052" width="275" height="76" rx="14" class="side"/>
  <text x="247" y="3083" class="small"><tspan x="247">Show an error</tspan><tspan x="247" dy="23">and try again</tspan></text>
  <path d="M247 3052 V2985 H478" class="loop"/>
  <path d="M700 3148 V3165" class="line"/>
  <text x="720" y="3160" class="label">Yes</text>
  <rect x="480" y="3167" width="440" height="58" rx="14" class="node"/>
  <text x="700" y="3203" class="body">Admin dashboard and features</text>
  <path d="M700 3225 V3247" class="line"/>
  <polygon points="700,3249 825,3302 700,3355 575,3302" class="decision"/>
  <text x="700" y="3309" class="small">Logout?</text>
  <path d="M575 3302 H470 V3196 H478" class="loop"/>
  <text x="490" y="3287" class="label">No</text>
  <path d="M700 3355 V3390" class="line"/>
  <text x="720" y="3380" class="label">Yes</text>
  <ellipse cx="700" cy="3435" rx="150" ry="36" class="end"/>
  <text x="700" y="3442" class="small">Return to the home page</text>
</svg>
